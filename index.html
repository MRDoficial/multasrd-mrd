<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRD MultasRD - Consulta Real PGR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;background:#f6f8fc;display:flex;flex-direction:column}
.top{height:44px;background:#0a3a7a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:1px;gap:8px}
.top b{color:#00e5ff}
.hd{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.card{flex:1;display:flex;flex-direction:column;max-width:500px;width:100%;margin:0 auto;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.06)}
.inputBar{display:flex;gap:8px;padding:12px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.input{flex:1;padding:14px 16px;border-radius:14px;background:#eef2ff;border:2px solid transparent;outline:none;font-weight:900;font-size:16px;color:#0a3a7a}
.btn{background:#0a3a7a;color:#fff;font-weight:900;padding:14px 18px;border-radius:14px;border:none;font-size:13px;cursor:pointer}
.iframeWrap{flex:1;position:relative;background:#fff}
.iframeWrap iframe{width:100%;height:100%;border:none;display:block;min-height:70vh}
.badge{position:absolute;top:8px;left:8px;background:#0a3a7a;color:#fff;font-size:9px;font-weight:900;padding:6px 10px;border-radius:20px;z-index:5}
.foot{height:70px;background:#eef2ff;border-top:1px solid #dbeafe;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
</style>
</head>
<body>
<div class="top">🔒 CONEXIÓN REAL • <b>multas.pgr.gob.do</b> • 100% OFICIAL</div>
<div class="hd">
<div style="display:flex;align-items:center;gap:8px">
<div style="width:34px;height:34px;background:#0a3a7a;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900">MRD</div>
<div><p style="font-weight:900;color:#0a3a7a">MultasRD</p><p style="font-size:9px;color:#00b7eb;font-weight:700">REAL PGR</p></div>
</div>
<a href="https://multas.pgr.gob.do/consultas/consultasciudadano" target="_blank" style="font-size:10px;font-weight:900;color:#0a3a7a;text-decoration:none;border:1px solid #0a3a7a;padding:8px 12px;border-radius:20px">Abrir PGR ↗</a>
</div>
<div class="card">
<div class="inputBar">
<input id="q" class="input" placeholder="001-1234567-8">
<button id="btn" class="btn">CONSULTAR</button>
</div>
<div style="padding:8px 12px;background:#fffbe6;border-bottom:1px solid #ffe69c;display:flex;gap:8px;align-items:center">
<span style="font-size:16px">💡</span>
<p style="font-size:10px;font-weight:700;color:#664d03">Escribe tu cédula arriba y dale CONSULTAR. Abajo está la página oficial de la PGR con tu nombre real.</p>
</div>
<div class="iframeWrap">
<div class="badge">PGR OFICIAL EN VIVO</div>
<iframe id="pgr" src="https://multas.pgr.gob.do/consultas/consultasciudadano"></iframe>
</div>
</div>
<div class="foot">
<p style="font-size:12px;font-weight:900;color:#0a3a7a;opacity:.3">JoelvisionX</p>
<p style="font-size:9px;font-weight:700;color:#94a3b8">REPÚBLICA DOMINICANA • DATOS OFICIALES PGR</p>
</div>
<script>
const iframe=document.getElementById('pgr');const q=document.getElementById('q');const btn=document.getElementById('btn');
btn.onclick=()=>{const val=q.value.trim();if(!val){alert('Escribe tu cédula');return;}navigator.clipboard.writeText(val).then(()=>{alert('✅ Cédula '+val+' copiada. Pégala abajo en la PGR oficial');}).catch(()=>{alert('Cédula: '+val);});iframe.scrollIntoView({behavior:'smooth'});setTimeout(()=>{try{const t=iframe.contentDocument;}catch(e){if(confirm('La PGR bloqueó la vista dentro de MRD. ¿Abrir en pestaña nueva?')){window.open('https://multas.pgr.gob.do/consultas/consultasciudadano','_blank');}}},1500);};
q.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
</script>
</body>
</html>
